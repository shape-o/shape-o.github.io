<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yay! Get Trolled</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff007f, #7f00ff, #00f0ff);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .prank-box {
            background: rgba(0, 0, 0, 0.65);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 38px;
            color: #ffff00;
            margin-bottom: 10px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        p {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .ad-tag {
            background-color: #ffcc00;
            color: #000;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .image-card {
            position: relative;
            display: block;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            transition: transform 0.2s;
        }

        .image-card:hover {
            transform: scale(1.02);
        }

        .image-card img {
            width: 100%;
            display: block;
        }

        .back-btn {
            display: inline-block;
            background-color: #ffffff;
            color: #000000;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: transform 0.2s;
        }

        .back-btn:hover {
            transform: scale(1.05);
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <div class="prank-box">
        <span class="ad-tag">Advertisement</span>
        <h1>yay! get trolled</h1>
        <p>watch this video! this an advertisement!</p>

        <!-- Clicking troll.jpg opens the YouTube video link in a new tab -->
        <a href="https://youtu.be/bVhUfDvXMns?si=k-cCKp6BzA9JErPY" target="_blank" class="image-card">
            <img src="troll.jpg" alt="Troll Video Thumbnail">
        </a>

        <a href="winner.html" class="back-btn">Go Back to Report</a>
    </div>

</body>
</html>
