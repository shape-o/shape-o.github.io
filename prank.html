<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yay! Get Trolled</title>
    <style>
        body {
            /* Bright, colorful gradient background */
            background: linear-gradient(135deg, #ff007f, #7f00ff, #00f0ff);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .prank-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 650px;
        }

        h1 {
            font-size: 48px;
            color: #ffff00;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        p {
            font-size: 22px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* YouTube video link styling */
        p a {
            color: #00ffff;
            font-weight: bold;
            text-decoration: underline;
        }

        p a:hover {
            color: #ffff00;
        }

        .ad-tag {
            background-color: #ffcc00;
            color: #000;
            font-size: 14px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .back-btn {
            display: inline-block;
            background-color: #ffffff;
            color: #000000;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s;
        }

        .back-btn:hover {
            transform: scale(1.05);
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <div class="prank-box">
        <span class="ad-tag">Advertisement</span>
        <h1>yay! get trolled</h1>
        <!-- Clickable video link embedded directly into the text -->
        <p>watch this video! this an advertisement! <br>
           <a href="https://youtu.be/bVhUfDvXMns?si=k-cCKp6BzA9JErPY" target="_blank">[Click here to watch the video]</a>
        </p>
        <a href="winner.html" class="back-btn">Go Back to Report</a>
    </div>

</body>
</html>
